<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <link rel="stylesheet" href="css/chats.css" />
    <style>
        /* Adicione estilos básicos para as mensagens */
        .message {
            padding: 8px 12px;
            margin: 6px 0;
            border-radius: 12px;
            max-width: 70%;
            word-wrap: break-word;
            font-size: 14px;
            position: relative;
        }
        .message.sent {
            background-color: #1e90ff;
            color: white;
            align-self: flex-end;
        }
        .message.received {
            background-color: #ddd;
            color: #333;
            align-self: flex-start;
        }
        .timestamp {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
            text-align: right;
        }
        #messagesContainer {
            display: flex;
            flex-direction: column;
            height: 350px;
            overflow-y: auto;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        /* Outras estilizações, se precisar, podem continuar */
    </style>
    
</head>
<body>
    <a href="catalogo.html" class="logout-button">
        <img src="images/sair.png" alt="Voltar" class="logout-icon" />
    </a>

    <div class="chat-container">
        <div class="chat-list">
            <h2>Conversas</h2>
            <ul id="chatList"></ul>
        </div>

        <div class="chat-box">
            <div id="chatHeader" class="chat-header">
                <img id="animalImage" src="" alt="Imagem do Animal" class="animal-img" />
                <h3 id="chatTitle"></h3>
                
            </div>

            <div id="messagesContainer" class="messages-container">
                <!-- Mensagens serão adicionadas aqui -->
            </div>

            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." />
                <button id="sendButton">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const chatList = document.getElementById("chatList");
            const chatHeader = document.getElementById("chatHeader");
            const chatTitle = document.getElementById("chatTitle");
            const animalImage = document.getElementById("animalImage");
            const messagesContainer = document.getElementById("messagesContainer");
            const sendButton = document.getElementById("sendButton");
            const messageInput = document.getElementById("messageInput");

            const usuarioLocal = JSON.parse(localStorage.getItem("usuarioLogado") || "null");
            const meuNomePadrao = (usuarioLocal && usuarioLocal.nome) ? usuarioLocal.nome : "Você";

            function obterHeaders() {
                const h = { 'Content-Type': 'application/json' };
                if (usuarioLocal && usuarioLocal.id) {
                    h['x-usuario-id'] = String(usuarioLocal.id);
                }
                return h;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const animalIdParam = urlParams.get("animalId");

            if (animalIdParam) {
                await fetch('/api/chats', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: obterHeaders(),
                    body: JSON.stringify({ animal_id: animalIdParam })
                });
            }

            const res = await fetch('/api/chats', {
                credentials: 'same-origin',
                headers: obterHeaders()
            });
            if (res.status === 401) {
                window.location.href = 'login.html';
                return;
            }
            const chats = await res.json();
            let chatAtivo = null;

            // Botão de concluir adoção / marcar como encontrado
            const btnAdocao = document.createElement("button");
            btnAdocao.className = "finalizar-button";
            btnAdocao.style.display = "none";
            chatHeader.appendChild(btnAdocao);

            btnAdocao.addEventListener("click", async () => {
                if (!chatAtivo) return;
                const ehPerdido = chatAtivo.tipo_anuncio === 'PERDIDO';
                const nomeOutro = obterNomeOutroUsuario(chatAtivo);
                const msgConfirm = ehPerdido
                    ? `Confirmar que o animal perdido ${chatAtivo.nome} foi encontrado?`
                    : `Confirmar que ${nomeOutro} adotou ${chatAtivo.nome}?`;

                if (!confirm(msgConfirm)) return;

                const r = await fetch('/api/adocao', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: obterHeaders(),
                    body: JSON.stringify({ chat_id: chatAtivo.chat_id, animal_id: chatAtivo.animal_id })
                });
                const d = await r.json();
                alert(d.message || d.error);
                if (r.ok) btnAdocao.style.display = "none";
            });

            function obterNomeOutroUsuario(chat) {
                if (chat.outro_usuario_nome) return chat.outro_usuario_nome;
                if (usuarioLocal && Number(chat.anunciante_id) === Number(usuarioLocal.id)) {
                    return chat.adotante_nome || "Interessado";
                }
                return chat.anunciante_nome || "Responsável";
            }

            if (chats.length === 0) {
                chatList.innerHTML = "<p style='color:white; text-align:center;'>Você ainda não possui conversas.</p>";
                return;
            }

            chats.forEach((chat) => {
                const nomeOutro = obterNomeOutroUsuario(chat);
                const ehPerdido = chat.tipo_anuncio === 'PERDIDO';
                const tagModalidade = ehPerdido
                    ? `<span style="display:inline-block; background:#ff4d4d; color:#fff; font-size:10px; font-weight:bold; padding:2px 6px; border-radius:10px; margin-bottom:3px;">🚨 Animal Perdido</span><br>`
                    : `<span style="display:inline-block; background:#1e90ff; color:#fff; font-size:10px; font-weight:bold; padding:2px 6px; border-radius:10px; margin-bottom:3px;">🐾 Adoção</span><br>`;

                const li = document.createElement("li");
                li.innerHTML = `
                    <img src="${chat.imagem || chat.animal_imagem}" alt="${chat.nome || chat.animal_nome}">
                    <div>
                        ${tagModalidade}
                        <strong>${chat.nome || chat.animal_nome}</strong><br>
                        <small style="font-size: 13px; color: #666;">Com: ${nomeOutro}</small>
                    </div>
                `;
                li.style.cursor = 'pointer';
                li.addEventListener("click", () => carregarChat(chat));
                chatList.appendChild(li);
            });

            async function carregarChat(chat) {
                chatAtivo = chat;
                const nomeAnimal = chat.nome || chat.animal_nome;
                const nomeOutro = obterNomeOutroUsuario(chat);
                const ehPerdido = chat.tipo_anuncio === 'PERDIDO';

                const badgeHeader = ehPerdido
                    ? `<span style="background:#ff4d4d; color:#fff; font-size:12px; font-weight:bold; padding:3px 10px; border-radius:12px; margin-right:8px; vertical-align:middle;">🚨 Animal Perdido</span>`
                    : `<span style="background:#1e90ff; color:#fff; font-size:12px; font-weight:bold; padding:3px 10px; border-radius:12px; margin-right:8px; vertical-align:middle;">🐾 Adoção</span>`;

                chatTitle.innerHTML = `${badgeHeader} ${nomeAnimal} — Conversa com ${nomeOutro}`;
                animalImage.src = chat.imagem || chat.animal_imagem;

                if (chat.sou_anunciante && chat.status_anuncio === 'ATIVO') {
                    btnAdocao.innerHTML = ehPerdido
                        ? `<span>✅ Marcar como Encontrado</span>`
                        : `<span>✅ Confirmar Adoção</span>`;
                    btnAdocao.style.display = "flex";
                } else {
                    btnAdocao.style.display = "none";
                }

                await atualizarMensagens();
            }

            async function atualizarMensagens() {
                if (!chatAtivo) return;
                const resMsg = await fetch(`/api/chats/${chatAtivo.chat_id}/mensagens`, {
                    credentials: 'same-origin',
                    headers: obterHeaders()
                });
                const lista = await resMsg.json();
                messagesContainer.innerHTML = "";

                const nomeOutro = obterNomeOutroUsuario(chatAtivo);

                lista.forEach(msg => {
                    const div = document.createElement("div");
                    div.className = `message ${msg.tipo}`;

                    const autor = msg.remetente_nome
                        ? msg.remetente_nome
                        : (msg.tipo === 'sent' ? meuNomePadrao : nomeOutro);

                    div.innerHTML = `<strong>${autor}:</strong> ${msg.texto}`;

                    const spanTime = document.createElement("div");
                    spanTime.className = "timestamp";
                    spanTime.textContent = new Date(msg.timestamp).toLocaleString('pt-BR', {
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });

                    div.appendChild(spanTime);
                    messagesContainer.appendChild(div);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            sendButton.addEventListener("click", async () => {
                if (!chatAtivo || !messageInput.value.trim()) return;
                await fetch(`/api/chats/${chatAtivo.chat_id}/mensagens`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: obterHeaders(),
                    body: JSON.stringify({ texto: messageInput.value.trim() })
                });
                messageInput.value = "";
                await atualizarMensagens();
            });

            messageInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") sendButton.click();
            });

            const inicial = animalIdParam
                ? chats.find(c => String(c.animal_id) === String(animalIdParam))
                : chats[0];
            carregarChat(inicial || chats[0]);
        });
    </script>
</body>
</html>
