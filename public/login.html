<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Images/Adopt 500x500.png" type="image/x-icon">
    <title>Login - Adopetz</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <a href="home.html">
            <img src="Images/Adopt 75x75.png" alt="Logo Adopetz" class="logo">
        </a>        
        <h2>Login</h2>
        <div id="error-message" style="display: none; color: #ff6f61; text-align: center; margin-bottom: 15px; font-weight: bold;"></div>

        <form id="login-form">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

            <button type="submit">Entrar</button>
            <a href="register.html">Registre-se</a>
            <a href="redefinir-senha.html">Esqueceu a senha?</a>
        </form>

   
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email, senha })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('usuarioLogado', JSON.stringify(data.usuario));
                    window.location.href = 'homelogada.html';
                } else {
                    errorDiv.textContent = data.error || 'E-mail ou senha inválidos.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Erro de conexão. Acesse via http://localhost:3000';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
